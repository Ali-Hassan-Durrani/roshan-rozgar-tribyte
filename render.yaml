# Render Blueprint: New + → Blueprint → pick this repo. Creates the database and all three services.
# Free web services can't receive private-network traffic, so services talk over their public URLs:
# after the first deploy set AI_SERVICE_URL (api) and BACKEND_URL (web) to the real URLs, then redeploy web.

databases:
  - name: roshan-rozgar-db
    plan: free
    databaseName: roshan_rozgar
    user: roshan

services:
  # FastAPI AI service (Docker: includes Tesseract OCR)
  - type: web
    name: roshan-rozgar-ai
    runtime: docker
    plan: free
    dockerfilePath: ./ai/Dockerfile
    dockerContext: ./ai
    healthCheckPath: /health
    envVars:
      - key: AI_INTERNAL_KEY
        fromService: { type: web, name: roshan-rozgar-api, envVarKey: AI_INTERNAL_KEY }
      - { key: ELEVENLABS_API_KEY, sync: false }
      - { key: ELEVENLABS_VOICE_ID_UR, sync: false }
      - { key: ELEVENLABS_VOICE_ID_EN, sync: false }
      - { key: ELEVENLABS_TTS_MODEL, value: eleven_multilingual_v2 }
      - { key: LLM_API_KEY, sync: false }
      - { key: LLM_MODEL, value: gemini-3.1-flash-lite }
      - { key: DEMO_MODE, value: "true" }

  # NestJS API
  - type: web
    name: roshan-rozgar-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: the Nest CLI, Prisma CLI and TypeScript are dev dependencies (NODE_ENV=production would skip them)
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: NODE_VERSION, value: "22" }
      - key: DATABASE_URL
        fromDatabase: { name: roshan-rozgar-db, property: connectionString }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: JWT_REFRESH_SECRET, generateValue: true }
      - { key: VOICE_TOKEN_SECRET, generateValue: true }
      - { key: OTP_PEPPER, generateValue: true }
      - { key: CNIC_ENC_KEY, generateValue: true }
      - { key: CNIC_HMAC_KEY, generateValue: true }
      - { key: AI_INTERNAL_KEY, generateValue: true }
      - { key: AI_SERVICE_URL, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: BACKEND_PUBLIC_URL, sync: false }
      - { key: ADMIN_PHONES, value: "03000000003" }
      - { key: DEMO_MODE, value: "true" }
      - { key: DEMO_PHONES, value: "03000000001,03000000002,03000000003" }
      - { key: OTP_MODE, value: simgate }
      - { key: SIMGATE_API_KEY, sync: false }
      - { key: SIMGATE_DEVICE_ID, sync: false }
      - { key: SIMGATE_URL, value: "https://api.simgate.app/v1/sms/send" }
      - { key: VAPI_WEBHOOK_SECRET, sync: false }

  # Next.js web app
  - type: web
    name: roshan-rozgar-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: BACKEND_URL, sync: false }
      - key: JWT_ACCESS_SECRET
        fromService: { type: web, name: roshan-rozgar-api, envVarKey: JWT_ACCESS_SECRET }
      - { key: NEXT_PUBLIC_VAPI_PUBLIC_KEY, sync: false }
      - { key: NEXT_PUBLIC_VAPI_WORKER_ASSISTANT_ID, sync: false }
      - { key: NEXT_PUBLIC_VAPI_CUSTOMER_ASSISTANT_ID, sync: false }
      - { key: NEXT_PUBLIC_MAPBOX_TOKEN, sync: false }

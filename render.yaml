databases:
  - name: rr-db
    plan: free

services:
  - type: web
    name: rr-ai
    runtime: docker
    rootDir: ai
    plan: free
    envVars:
      - { key: AI_INTERNAL_KEY, sync: false }
      - { key: ELEVENLABS_API_KEY, sync: false }
      - { key: ELEVENLABS_VOICE_ID_UR, sync: false }
      - { key: ELEVENLABS_VOICE_ID_EN, sync: false }
      - { key: ELEVENLABS_TTS_MODEL, sync: false }
      - { key: LLM_API_KEY, sync: false }
      - { key: LLM_MODEL, value: gemini-3.1-flash-lite }
      - { key: DEMO_MODE, value: "true" }

  - type: web
    name: rr-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: rr-db, property: connectionString } }
      - { key: JWT_ACCESS_SECRET, sync: false }
      - { key: JWT_REFRESH_SECRET, sync: false }
      - { key: VOICE_TOKEN_SECRET, sync: false }
      - { key: OTP_PEPPER, sync: false }
      - { key: CNIC_ENC_KEY, sync: false }
      - { key: CNIC_HMAC_KEY, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: BACKEND_PUBLIC_URL, sync: false }
      - { key: ADMIN_PHONES, sync: false }
      - { key: DEMO_MODE, value: "true" }
      - { key: DEMO_PHONES, sync: false }
      - { key: OTP_MODE, value: simgate }
      - { key: SIMGATE_API_KEY, sync: false }
      - { key: SIMGATE_DEVICE_ID, sync: false }
      - { key: SIMGATE_URL, value: "https://api.simgate.app/v1/sms/send" }
      - { key: AI_SERVICE_URL, sync: false }
      - { key: AI_INTERNAL_KEY, sync: false }
      - { key: VAPI_WEBHOOK_SECRET, sync: false }

  - type: web
    name: rr-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - { key: BACKEND_URL, sync: false }
      - { key: JWT_ACCESS_SECRET, sync: false }
      - { key: NEXT_PUBLIC_VAPI_PUBLIC_KEY, sync: false }
      - { key: NEXT_PUBLIC_VAPI_WORKER_ASSISTANT_ID, sync: false }
      - { key: NEXT_PUBLIC_VAPI_CUSTOMER_ASSISTANT_ID, sync: false }
      - { key: NEXT_PUBLIC_MAPBOX_TOKEN, sync: false }
